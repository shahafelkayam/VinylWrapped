# Applies the database schema (tables, security rules, functions) and deploys the auth-login
# Edge Function to your Supabase project. Runs when anything under supabase/ changes on main.
name: Database

on:
  push:
    branches: [main]
    paths: ['supabase/**']
  workflow_dispatch:

permissions:
  contents: read

# Never run two migrations against the same database at once.
concurrency:
  group: supabase
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the Supabase settings
        run: |
          missing=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing secret:SUPABASE_ACCESS_TOKEN"
          [ -z "$SUPABASE_DB_PASSWORD" ] && missing="$missing secret:SUPABASE_DB_PASSWORD"
          [ -z "$SUPABASE_PROJECT_REF" ] && missing="$missing variable:SUPABASE_PROJECT_REF"
          if [ -n "$missing" ]; then
            echo "::error::Missing settings:$missing (see README › Run your own instance)."
            exit 1
          fi

      # Prove the security rules hold before they touch the real database.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Test the schema and security rules
        run: npx vitest run supabase

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Apply migrations
        run: supabase db push
      - name: Deploy the sign-in function
        run: supabase functions deploy auth-login --project-ref "$SUPABASE_PROJECT_REF"
