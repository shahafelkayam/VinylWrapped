# Builds the web app and publishes it to GitHub Pages.
# Your listening data is NOT baked into the site; the app fetches it from the data branch after you log in.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_APP_REPO: ${{ github.repository }}
          VITE_DATA_REPO: ${{ vars.DATA_REPO || github.repository }}
          VITE_DATA_BRANCH: ${{ vars.DATA_BRANCH || 'data' }}

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
